<svg width="1180" height="256" viewBox="0 0 1180 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Page & Squircle Shadows -->
    <filter id="squircleShadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.08" />
    </filter>
    <filter id="pageShadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1A2846" flood-opacity="0.14" />
    </filter>
    <filter id="curlShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-3" dy="-3" stdDeviation="5" flood-color="#000000" flood-opacity="0.18" />
    </filter>

    <!-- Bookmark Gradient -->
    <linearGradient id="bookmarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9CB3F9" />
      <stop offset="100%" stop-color="#5575E0" />
    </linearGradient>

    <!-- Left Cover Gradient -->
    <linearGradient id="leftCoverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5564A2" />
      <stop offset="100%" stop-color="#344177" />
    </linearGradient>
  </defs>

  <!-- Left Icon Group -->
  <g transform="translate(12, 8)">
    <!-- Base Squircle -->
    <rect width="240" height="240" rx="52" fill="#F8FAFC" opacity="0.4" />

    <!-- Left Cover & Spine -->
    <rect x="24" y="24" width="168" height="192" rx="28" fill="url(#leftCoverGrad)" filter="url(#pageShadow)" />

    <!-- Blue Bookmark Ribbon -->
    <path d="M48 16 V100 L68 84 L88 100 V16 H48 Z" fill="url(#bookmarkGrad)" filter="url(#pageShadow)" />

    <!-- Front White Paper Sheet -->
    <path d="M40 32 H192 C204 32 212 40 212 52 V164 L168 208 H52 C40 208 40 196 40 184 V32 Z" fill="#FFFFFF" filter="url(#pageShadow)" />

    <!-- Folded Corner Sheet -->
    <path d="M168 208 C184 208 212 192 212 164 H180 C172 164 168 168 168 176 V208 Z" fill="#F1F5F9" filter="url(#curlShadow)" />

    <!-- Subtle Horizontal Ruled Lines -->
    <line x1="64" y1="64" x2="184" y2="64" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" />
    <line x1="152" y1="84" x2="184" y2="84" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" />
    <line x1="64" y1="152" x2="140" y2="152" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" />
    <line x1="64" y1="172" x2="128" y2="172" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" />

    <!-- Centered Serif Letter "O" -->
    <text x="126" y="152" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="900" font-size="108" fill="#263956" letter-spacing="-1">O</text>
  </g>

  <!-- Right Wordmark: OpenNotes (Expanded ViewBox to prevent "s" truncation) -->
  <text x="270" y="170" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-weight="700" font-size="144" fill="#263956" letter-spacing="-3">OpenNotes</text>
</svg>
